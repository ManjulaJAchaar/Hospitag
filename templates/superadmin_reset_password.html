<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Superadmin Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --accent-teal: #38b2ac;
            --border-teal: #b2f5ea;
            --input-bg: #f9fafb;
            --card-bg: #fff;
            --shadow-teal: rgba(56,178,172,0.10);
            --text-main: #000;
            --text-muted: #555;
        }

        body {
            background: var(--card-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 6px 24px var(--shadow-teal);
            border: 1px solid var(--border-teal);
            position: relative;
            padding: 1.3rem 1.1rem;
            max-width: 340px;
            width: 100%;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--accent-teal);
        }

        .admin-icon {
            font-size: 2.3rem;
            margin-bottom: 0.5rem;
            color: var(--accent-teal);
            display: block;
            text-align: center;
        }

        h3 {
            font-weight: 700;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 0.3rem;
        }

        .system-role {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 0.35rem;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            color: #7e9392;
        }

        .form-control {
            border: 1.5px solid #ddd;
            border-radius: 10px;
            background: var(--input-bg);
            padding: 0.6rem 0.85rem 0.6rem 2.2rem;
        }

        .form-control:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 0.13rem rgba(56,178,172,0.12);
            background: #fff;
        }

        .btn-primary {
            background: var(--accent-teal);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 0.6rem;
            width: 100%;
        }

        .btn-primary:hover {
            background: #269d96;
        }

        .back-link {
            text-align: center;
            margin-top: 0.8rem;
        }

        .back-link a {
            color: var(--accent-teal);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .alert-danger {
            background: rgba(220,53,69,0.1);
            border-left: 4px solid #dc3545;
        }
    </style>
</head>

<body>

<div class="login-card">
    <span class="admin-icon">
        <i class="fas fa-user-shield"></i>
    </span>

    <h3>Superadmin Reset Password</h3>
    <div class="system-role">Enter OTP and set a new password</div>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="email" value="{{ email }}">

        <div class="mb-3">
            <label class="form-label">
                <i class="fas fa-key text-muted me-1"></i> Superadmin OTP
            </label>
            <div class="input-group">
                <span class="input-icon">
                    <i class="fas fa-key"></i>
                </span>
                <input type="text" name="otp" class="form-control" required placeholder="Enter OTP">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">
                <i class="fas fa-lock text-muted me-1"></i> New Password
            </label>
            <div class="input-group">
                <span class="input-icon">
                    <i class="fas fa-lock"></i>
                </span>
                <input type="password" name="new_password" class="form-control" required minlength="8" placeholder="Enter new password">
            </div>
        </div>

        <button class="btn btn-primary">
            <i class="fas fa-check-circle me-1"></i> Change Password
        </button>
    </form>

    <div class="back-link">
        <a href="/">← Back to Superadmin Login</a>
    </div>
</div>

</body>
</html>
