<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(90deg,#e5fbf7 0%,#b2ece7 100%);
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            min-height:100vh;
        }
        .container-edit {
            background: #fafeff;
            padding: 2rem 2.5rem;
            border-radius: 1.2rem;
            box-shadow: 0 4px 24px rgba(22,182,161,.11);
            max-width: 600px;
            margin: 36px auto;
        }
        .edit-header {
            background: linear-gradient(90deg,#16b6a1 0%,#43cca4 100%);
            color: #fff;
            border-radius: 1rem 1rem 0 0;
            padding: 1.8rem 1.5rem 1.2rem 1.5rem;
            text-align:center;
        }
        label {
            font-weight: 600;
            color: #16b6a1;
            margin-bottom:.2rem;
        }
        input, textarea {
            margin-bottom: 1rem !important;
        }
        input[readonly] {
            background-color: #eafaf7 !important;
            color: #888 !important;
            border-color: #d7f8f4 !important;
        }
        .section-title {
            color: #059986;
            font-weight: 700;
            font-size: 1.11rem;
            margin-bottom:10px;
            margin-top:20px;
        }
        .btn-update {
            background: linear-gradient(90deg,#16b6a1 0%,#43cca4 100%);
            color: #fff;
            font-weight: 500;
            border: none;
            border-radius: 30px;
            padding: 10px 30px;
            font-size: 1.09rem;
            box-shadow: 0 4px 10px rgba(22,182,161, .10);
            transition: background .13s;
        }
        .btn-update:hover {
            background: linear-gradient(90deg,#43cca4 0%, #16b6a1 100%);
        }
    </style>
</head>
<body>
    <div class="container-edit">
        <div class="edit-header">
            <h2 class="fw-bold mb-0"><i class="bi bi-pencil-fill me-2"></i>Edit Patient Details and Vitals</h2>
        </div>
        <form method="POST" class="mt-3">
            <!-- Patient Details Section (Read-Only) -->
            <div class="section-title"><i class="bi bi-person-fill me-1"></i>Patient Details</div>
            <div class="mb-2">
                <label for="full_name">Full Name:</label>
                <input type="text" class="form-control" name="full_name" value="{{ patient.full_name }}" readonly>
            </div>
            <div class="row g-2 mb-2">
                <div class="col">
                    <label for="age">Age:</label>
                    <input type="number" class="form-control" name="age" value="{{ patient.age }}" readonly>
                </div>
                <div class="col">
                    <label for="gender">Gender:</label>
                    <input type="text" class="form-control" name="gender" value="{{ patient.gender }}" readonly>
                </div>
            </div>
            <div class="mb-2">
                <label for="email">Email:</label>
                <input type="email" class="form-control" name="email" value="{{ patient.email }}" readonly>
            </div>
            <div class="row g-2 mb-2">
                <div class="col">
                    <label for="phone">Phone:</label>
                    <input type="text" class="form-control" name="phone" value="{{ patient.phone }}" readonly>
                </div>
                <div class="col">
                    <label for="address">Address:</label>
                    <input type="text" class="form-control" name="address" value="{{ patient.address }}" readonly>
                </div>
            </div>
            <!-- Vitals Section (Editable) -->
            <div class="section-title"><i class="bi bi-heart-pulse me-1"></i>Patient Vitals</div>
            <div class="row g-2">
                <div class="col-md-6 mb-2">
                    <label for="temperature">Temperature:</label>
                    <input type="number" class="form-control" name="temperature" value="{{ patient.temperature }}" step="0.1" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="bp_systolic">Blood Pressure (Systolic):</label>
                    <input type="number" class="form-control" name="bp_systolic" value="{{ patient.bp_systolic }}" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="bp_diastolic">Blood Pressure (Diastolic):</label>
                    <input type="number" class="form-control" name="bp_diastolic" value="{{ patient.bp_diastolic }}" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="pulse">Pulse:</label>
                    <input type="number" class="form-control" name="pulse" value="{{ patient.pulse }}" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="respiratory_rate">Respiratory Rate:</label>
                    <input type="number" class="form-control" name="respiratory_rate" value="{{ patient.respiratory_rate }}" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="sp_o2">SpO2:</label>
                    <input type="number" class="form-control" name="sp_o2" value="{{ patient.sp_o2 }}" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="weight">Weight:</label>
                    <input type="number" class="form-control" name="weight" value="{{ patient.weight }}" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="height">Height:</label>
                    <input type="number" class="form-control" name="height" value="{{ patient.height }}" required>
                </div>
            </div>
            <div class="row g-2">
                <div class="col-md-6 mb-2">
                    <label for="blood_sugar">Blood Sugar:</label>
                    <input type="number" class="form-control" name="blood_sugar" value="{{ patient.blood_sugar }}" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="pain_score">Pain Score:</label>
                    <input type="number" class="form-control" name="pain_score" value="{{ patient.pain_score }}" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="additional_notes">Additional Notes:</label>
                <textarea name="additional_notes" class="form-control" rows="2" required>{{ patient.additional_notes }}</textarea>
            </div>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-update">
                    <i class="bi bi-save2 me-1"></i>Update Vitals
                </button>
            </div>
        </form>
    </div>
</body>
</html>
