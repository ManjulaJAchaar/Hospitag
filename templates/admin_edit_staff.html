<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Edit Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-4">
    <h4>Edit Staff - {{ staff.full_name }}</h4>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
          <option value="Receptionist" {% if staff.role=='Receptionist' %}selected{% endif %}>Receptionist</option>
          <option value="Nurse" {% if staff.role=='Nurse' %}selected{% endif %}>Nurse</option>
          <option value="Doctor" {% if staff.role=='Doctor' %}selected{% endif %}>Doctor</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" value="{{ staff.full_name }}" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Gender</label>
        <select name="gender" class="form-select">
          <option value="Male" {% if staff.gender=='Male' %}selected{% endif %}>Male</option>
          <option value="Female" {% if staff.gender=='Female' %}selected{% endif %}>Female</option>
          <option value="Other" {% if staff.gender=='Other' %}selected{% endif %}>Other</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Email</label>
        <input type="email" name="email" value="{{ staff.email }}" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" value="{{ staff.phone }}" class="form-control">
      </div>

      <div class="col-md-2">
        <label class="form-label">Age</label>
        <input type="number" name="age" value="{{ staff.age }}" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Address</label>
        <input type="text" name="address" value="{{ staff.address }}" class="form-control">
      </div>


      <div class="col-md-6">
        <label class="form-label">Department</label>
        <input type="text" name="department" value="{{ staff.department }}" class="form-control">
      </div>


      <div class="col-md-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" value="{{ staff.username }}" class="form-control">
      </div>

      <div class="col-md-3">
        <label class="form-label">New Password (optional)</label>
        <input type="password" name="password" class="form-control">
        <small class="text-muted">Leave blank to keep existing password.</small>
      </div>

      <div class="col-12 mt-3">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</body>

</html>
