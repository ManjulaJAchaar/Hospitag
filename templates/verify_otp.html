<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify OTP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --accent-teal:#38b2ac; --border-teal:#b2f5ea; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#fff; }
    .card { max-width:360px; width:100%; border-radius:14px; border:1px solid var(--border-teal); box-shadow:0 6px 24px rgba(56,178,172,0.08); }
    .btn-primary { background:var(--accent-teal); border:none; }
    .btn-primary:hover { background:#269d96; }
  </style>
</head>
<body>
  <div class="card p-4">
    <h4 class="text-center mb-3">Verify OTP</h4>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('receptionist_verify_otp') }}">
      <label class="form-label">Enter 6-digit OTP</label>
      <input class="form-control mb-3" name="otp" maxlength="6" pattern="^[0-9]{6}$" required autofocus>
      <button class="btn btn-primary w-100">Verify</button>
    </form>

    <a class="d-block text-center mt-3" href="{{ url_for('receptionist_send_otp') }}">Resend OTP</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
