<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HR Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --accent-teal: #38b2ac;
            --border-teal: #b2f5ea;
            --input-bg: #f9fafb;
            --card-bg: #fff;
            --shadow-teal: rgba(56,178,172,0.10);
            --text-main: #000;
            --text-muted: #555;
        }

        body {
            background: var(--card-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 6px 24px var(--shadow-teal);
            border: 1px solid var(--border-teal);
            position: relative;
            padding: 1.3rem 1.1rem;
            max-width: 340px;
            width: 100%;
            margin: auto;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--accent-teal);
        }

        .admin-icon {
            font-size: 2.3rem;
            margin-bottom: 0.5rem;
            color: var(--accent-teal);
            display: block;
            text-align: center;
        }

        h3 {
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .system-role {
            color: var(--text-muted);
            font-size: 0.96rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        .form-label {
            color: var(--text-main);
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 0.35rem;
        }

        .input-group {
            position: relative;
        }

        .form-control {
            border: 1.5px solid #ddd;
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 1rem;
            padding: 0.6rem 0.85rem;
            padding-left: 2.2rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 0.13rem rgba(56,178,172,0.12);
            background: #fff;
        }

        .input-icon {
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            color: #7e9392;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--accent-teal);
            color: #fff;
            font-weight: 600;
            border: none;
            padding: 0.62rem 1.2rem;
            border-radius: 10px;
            font-size: 1rem;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary:hover, .btn-primary:focus {
            background: #269d96;
            color: #fff;
        }

        .back-link {
            color: var(--accent-teal);
            text-decoration: none;
            font-size: 0.96rem;
            transition: color 0.2s;
            text-align: center;
            display: block;
            margin-top: 1rem;
        }
        
        .back-link:hover, .back-link:focus {
            color: #269d96;
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        
        .alert-danger {
            background: rgba(220, 53, 69, 0.10);
            color: #a51825;
            border-left: 4px solid #dc3545;
        }
        
        .alert-success, .alert-info {
            background: rgba(56,178,172,0.10);
            color: var(--accent-teal);
            border-left: 4px solid var(--accent-teal);
        }
        
        @media (max-width: 576px) {
            body { padding: 0.5rem;}
            .login-card {
                padding: 0.9rem 0.2rem;
                border-radius: 9px;
                max-width: 96vw;
            }
            h3 { font-size: 1.03rem; margin-bottom: 0.45rem; }
        }
    </style>
</head>
<body>
<div class="login-card">
    <span class="admin-icon"><i class="fas fa-user-tie"></i></span>
    <h3>HR Login</h3>
    <div class="system-role">Human Resources Portal</div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" class="needs-validation" novalidate>
        <div class="mb-3">
            <label class="form-label" for="username"><i class="fas fa-user me-1 text-muted"></i> Username</label>
            <div class="input-group">
                <span class="input-icon"><i class="fas fa-user"></i></span>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="invalid-feedback ms-2">Please enter your username.</div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="password"><i class="fas fa-lock me-1 text-muted"></i> Password</label>
            <div class="input-group">
                <span class="input-icon"><i class="fas fa-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
            </div>
            <div class="invalid-feedback ms-2">Please enter your password.</div>
        </div>

        <button class="btn btn-primary" type="submit">
            <i class="fas fa-sign-in-alt me-2"></i>Login
        </button>
    </form>

    <a href="/" class="back-link">
        <i class="fas fa-arrow-left me-1"></i>Back to Home
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Bootstrap validation
    document.addEventListener('DOMContentLoaded', function () {
        (() => {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    });
</script>
</body>
</html>
