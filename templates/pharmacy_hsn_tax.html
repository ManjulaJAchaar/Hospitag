<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>HSN / Tax Master</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --teal-primary: #20b2aa;
      --teal-secondary: #008b8b;
      --teal-light: #b2dfdb;
      --teal-dark: #00695c;
      --teal-bg: #e0f2f1;
    }
    
    body {
      background-color: white;
    }
    
    .btn-teal {
      background-color: var(--teal-primary);
      border-color: var(--teal-primary);
      color: white;
    }
    
    .btn-teal:hover {
      background-color: var(--teal-secondary);
      border-color: var(--teal-secondary);
      color: white;
    }
    
    .table-teal {
      background-color: var(--teal-secondary);
      color: white;
    }
    
    .card {
      border: 1px solid var(--teal-light);
      box-shadow: 0 4px 6px rgba(32, 178, 170, 0.1);
    }
    
    .table-hover tbody tr:hover {
      background-color: var(--teal-bg);
      color: var(--teal-dark);
    }
    
    .btn-outline-teal {
      border-color: var(--teal-primary);
      color: var(--teal-primary);
    }
    
    .btn-outline-teal:hover {
      background-color: var(--teal-primary);
      border-color: var(--teal-primary);
      color: white;
    }
    
    h3 {
      color: var(--teal-dark);
    }
    
    .sl-no-col {
      width: 60px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold">HSN / Tax Master</h3>
    <a class="btn btn-teal" href="{{ url_for('pharmacy_hsn_tax_add') }}">+ Add HSN</a>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-teal">
          <tr>
            <th class="sl-no-col">Sl.No</th>
            <th>HSN</th>
            <th>Tax %</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
        {% for r in rows %}
          <tr>
            <td class="sl-no-col">{{ loop.index }}</td>
            <td class="fw-semibold">{{ r.hsn_code }}</td>
            <td>{{ r.tax_percent }}</td>
            <td>{{ r.description or "-" }}</td>
          </tr>
        {% endfor %}
        {% if not rows %}
          <tr><td colspan="4" class="text-center text-muted py-4">No HSN added yet.</td></tr>
        {% endif %}
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3">
    <a class="btn btn-outline-teal" href="{{ url_for('pharmacy_dashboard') }}">← Back to Dashboard</a>
  </div>
</div>
</body>
</html>
