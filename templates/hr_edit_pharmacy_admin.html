<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Edit Pharmacy Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --teal: #20b2aa;
      --teal-dark: #1a9b96;
      --teal-soft: #eaf8f7;

      --bg: #f6f8fb;
      --card: #ffffff;
      --border: #e6edf2;
      --text: #1f2937;
      --muted: #6b7280;

      --radius: 16px;
      --shadow: 0 10px 24px rgba(31, 41, 55, .08);
    }

    body {
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
    }

    .card-ui {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      background: var(--teal);
      color: #fff;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-head h5 {
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-pill {
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 650;
      font-size: .92rem;
      transition: all .15s ease;
    }

    .btn-teal {
      background: var(--teal);
      border: 1px solid var(--teal);
      color: #fff;
    }

    .btn-teal:hover {
      background: var(--teal-dark);
      border-color: var(--teal-dark);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-outline-light {
      border: 1px solid rgba(255, 255, 255, .7) !important;
      color: #fff !important;
    }

    .btn-outline-light:hover {
      background: rgba(255, 255, 255, .15) !important;
    }

    .form-label {
      font-weight: 650;
    }

    .form-control,
    .form-select {
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 10px 12px;
    }
  </style>
</head>

<body>
  <div class="container my-5">
    <div class="card-ui">

      <div class="card-head">
        <h5>
          <i class="fas fa-user-edit"></i>
          Edit Pharmacy Admin
          <span class="badge bg-light text-dark ms-2">
            ID: {{ admin.id }} | {{ admin.username }}
          </span>
        </h5>
        <a class="btn btn-pill btn-outline-light" href="{{ url_for('hr_view_pharmacy_admins') }}">
          <i class="fas fa-arrow-left"></i> Back
        </a>
      </div>

      <div class="p-4">
        <form method="POST">
          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input class="form-control" name="full_name" value="{{ admin.full_name }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Gender</label>
              <select class="form-select" name="gender" required>
                <option value="Male" {{ 'selected' if admin.gender=='Male' else '' }}>Male</option>
                <option value="Female" {{ 'selected' if admin.gender=='Female' else '' }}>Female</option>
                <option value="Other" {{ 'selected' if admin.gender=='Other' else '' }}>Other</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input class="form-control" name="email" value="{{ admin.email }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input class="form-control" name="phone" value="{{ admin.phone }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Username</label>
              <input class="form-control" name="username" value="{{ admin.username }}" required>
            </div>

            <div class="col-md-3">
              <label class="form-label">Active</label>
              <select class="form-select" name="is_active">
                <option value="1" {{ 'selected' if admin.is_active==1 else '' }}>Yes</option>
                <option value="0" {{ 'selected' if admin.is_active==0 else '' }}>No</option>
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label">Can Login</label>
              <select class="form-select" name="can_login">
                <option value="1" {{ 'selected' if admin.can_login==1 else '' }}>Yes</option>
                <option value="0" {{ 'selected' if admin.can_login==0 else '' }}>No</option>
              </select>
            </div>

          </div>

          <div class="mt-4 d-flex gap-2">
            <button class="btn btn-pill btn-teal" type="submit">
              <i class="fas fa-save"></i> Save Changes
            </button>
            <a class="btn btn-pill btn-outline-secondary" href="{{ url_for('hr_view_pharmacy_admins') }}">
              Cancel
            </a>
          </div>
        </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
