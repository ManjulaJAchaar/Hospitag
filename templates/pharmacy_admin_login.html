<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --accent-teal: #38b2ac;
            --accent-teal-hover: #2c9b95;
            --accent-teal-dark: #1f7a73;
            --border-teal: #b2f5ea;
            --input-bg: #f9fafb;
            --card-bg: #fff;
            --shadow-teal: rgba(56,178,172,0.12);
            --text-main: #1a202c;
            --text-muted: #4a5568;
            --background-primary: #f0fdfa;
            --background-gradient: rgba(56, 178, 172, 0.06);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            25% {
                transform: translateY(-8px) rotate(2deg);
            }
            75% {
                transform: translateY(-4px) rotate(-1deg);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(56, 178, 172, 0.5);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(56, 178, 172, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(56, 178, 172, 0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--background-primary) 0%, #e6fffa 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 25% 25%, var(--background-gradient) 0%, transparent 70%),
                radial-gradient(circle at 75% 75%, var(--background-gradient) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-container {
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 
                0 20px 60px rgba(56, 178, 172, 0.08),
                0 8px 25px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(178, 245, 234, 0.3);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .login-card:hover {
            transform: translateY(-8px);
            box-shadow: 
                0 32px 80px rgba(56, 178, 172, 0.12),
                0 12px 40px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .login-header {
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-teal-hover) 100%);
            color: white;
            text-align: center;
            padding: 50px 40px 40px;
            position: relative;
            overflow: hidden;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            animation: shimmer 3s infinite;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-teal-hover), var(--accent-teal-dark));
        }

        .pills-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
            animation: float 4s ease-in-out infinite;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        .title-text {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            animation: slideInFromTop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            letter-spacing: -0.02em;
        }

        .subtitle-text {
            font-size: 1rem;
            opacity: 0.9;
            animation: slideInFromTop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
            font-weight: 400;
        }

        .card-body {
            padding: 40px;
        }

        .form-wrapper {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            transition: color 0.3s ease;
        }

        .input-icon {
            color: var(--accent-teal);
            margin-right: 8px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .form-control {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px 18px;
            font-size: 1rem;
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            position: relative;
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .form-control:hover {
            border-color: var(--accent-teal);
            transform: translateY(-1px);
        }

        .form-control:focus {
            border-color: var(--accent-teal);
            box-shadow: 
                0 0 0 4px rgba(56, 178, 172, 0.08),
                0 4px 20px rgba(56, 178, 172, 0.1);
            background-color: white;
            transform: translateY(-2px);
            outline: none;
        }

        .form-control:focus + .form-label .input-icon {
            color: var(--accent-teal-hover);
            transform: scale(1.1);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-teal-hover) 100%);
            border: none;
            padding: 18px 24px;
            font-weight: 700;
            font-size: 1.05rem;
            border-radius: 12px;
            color: white;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: left 0.5s;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, var(--accent-teal-hover) 0%, var(--accent-teal-dark) 100%);
            transform: translateY(-3px);
            box-shadow: 
                0 12px 30px rgba(56, 178, 172, 0.3),
                0 6px 20px rgba(0, 0, 0, 0.1);
            animation: pulse 2s infinite;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:active {
            transform: translateY(-1px);
        }

        .back-link {
            color: var(--accent-teal);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .back-link:hover {
            color: var(--accent-teal-hover);
            background-color: rgba(56, 178, 172, 0.05);
            transform: scale(1.05);
            text-decoration: none;
        }

        .alert {
            border-radius: 12px;
            border: none;
            animation: slideInFromTop 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 24px;
            padding: 16px 20px;
            font-weight: 500;
            position: relative;
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(56,178,172,0.08) 0%, rgba(56,178,172,0.12) 100%);
            color: var(--accent-teal-dark);
            border-left: 4px solid var(--accent-teal);
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.08) 0%, rgba(220, 53, 69, 0.12) 100%);
            color: #c53030;
            border-left: 4px solid #e53e3e;
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            body {
                padding: 10px;
            }
            
            .login-card {
                border-radius: 20px;
            }
            
            .login-header {
                padding: 40px 30px 30px;
            }
            
            .card-body {
                padding: 30px 25px;
            }
            
            .title-text {
                font-size: 1.5rem;
            }
            
            .pills-icon {
                font-size: 3rem;
            }
        }

        @media (max-width: 480px) {
            .card-body {
                padding: 25px 20px;
            }
            
            .login-header {
                padding: 35px 25px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-pills pills-icon"></i>
                <h3 class="title-text">Pharmacy Admin Login</h3>
                <p class="mb-0 subtitle-text">Access your pharmacy management system</p>
            </div>
            
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show">
                    <i class="fas fa-{{ 'exclamation-triangle' if category == 'error' else 'check-circle' }} me-2"></i>
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <div class="form-wrapper">
                    <form method="POST" novalidate>
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-user input-icon"></i>
                                Username
                            </label>
                            <input type="text" class="form-control" name="username" placeholder="Enter your username" required autocomplete="username">
                        </div>

                                                <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-lock input-icon"></i>
                                Password
                            </label>
                            <input type="password" class="form-control" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="btn btn-login">
                            <i class="fas fa-sign-in-alt"></i>
                            Login to Pharmacy System
                        </button>
                    </form>

                    <div class="text-center">
                        <a href="/" class="back-link">
                            <i class="fas fa-home"></i>
                            Back to Homepage
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Enhanced form validation and interactions
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const inputs = document.querySelectorAll('.form-control');
            const loginButton = document.querySelector('.btn-login');

            // Add focus/blur effects
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentNode.classList.add('focused');
                });

                input.addEventListener('blur', function() {
                    this.parentNode.classList.remove('focused');
                    if (this.value.trim() === '') {
                        this.classList.remove('has-content');
                    } else {
                        this.classList.add('has-content');
                    }
                });

                // Check for pre-filled content on load
                if (input.value.trim() !== '') {
                    input.classList.add('has-content');
                }
            });

            // Form submission enhancement
            form.addEventListener('submit', function(e) {
                let isValid = true;
                
                inputs.forEach(input => {
                    if (input.hasAttribute('required') && input.value.trim() === '') {
                        isValid = false;
                        input.classList.add('is-invalid');
                        
                        // Remove invalid class after user starts typing
                        input.addEventListener('input', function() {
                            this.classList.remove('is-invalid');
                        }, { once: true });
                    }
                });

                if (isValid) {
                    // Add loading state to button
                    loginButton.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Logging in...';
                    loginButton.disabled = true;
                }
            });

            // Add smooth scroll for alerts
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                setTimeout(() => {
                    alert.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            });
        });

        // Add custom styles for enhanced interactions
        const style = document.createElement('style');
        style.textContent = `
            .form-group.focused .input-icon {
                color: var(--accent-teal-hover) !important;
                transform: scale(1.1);
            }
            
            .form-control.has-content {
                border-color: var(--accent-teal);
                background-color: white;
            }
            
            .form-control.is-invalid {
                border-color: #e53e3e;
                animation: shake 0.5s ease-in-out;
            }
            
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
            
            .btn-login:disabled {
                opacity: 0.8;
                cursor: not-allowed;
                transform: none !important;
            }
            
            .btn-login:disabled:hover {
                animation: none;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
