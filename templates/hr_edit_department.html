<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Department</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --teal: #009688;
            --teal-light: #e0f7fa;
            --teal-dark: #00796b;
            --teal-card: #26a69a;
            --gray-bg: #f7f9fc;
            --shadow: 0 4px 12px rgba(0, 150, 136, 0.12);
            --border-radius: 12px;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-title {
            color: var(--teal-dark);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-subtitle {
            color: #666;
            font-size: 1rem;
            opacity: 0.8;
        }

        .form-container {
            background: linear-gradient(135deg, #ffffff 0%, var(--teal-light) 100%);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2.5rem;
            border: 1px solid rgba(0, 150, 136, 0.1);
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--teal) 0%, var(--teal-card) 50%, var(--teal-dark) 100%);
        }

        .form-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .form-label {
            color: var(--teal-dark);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .form-label i {
            margin-right: 0.75rem;
            color: var(--teal);
            font-size: 1.2rem;
            width: 20px;
            text-align: center;
        }

        .form-control {
            border: 2px solid rgba(0, 150, 136, 0.2);
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #ffffff;
            box-shadow: 0 2px 4px rgba(0, 150, 136, 0.05);
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 0.2rem rgba(0, 150, 136, 0.15), 
                        0 4px 8px rgba(0, 150, 136, 0.1);
            background: #ffffff;
            outline: 0;
            transform: translateY(-1px);
        }

        .form-control:hover:not(:focus) {
            border-color: var(--teal-card);
            box-shadow: 0 3px 6px rgba(0, 150, 136, 0.08);
        }

        .form-control::placeholder {
            color: #999;
            opacity: 0.8;
        }

        .textarea-container {
            position: relative;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            padding-bottom: 35px; /* Space for character counter */
        }

        .char-counter {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.8rem;
            color: var(--teal);
            opacity: 0.7;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-container {
            text-align: center;
            margin-top: 2rem;
        }

        .btn-teal {
            background: linear-gradient(135deg, var(--teal) 0%, var(--teal-card) 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 40px;
            border-radius: 10px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 150, 136, 0.3);
            position: relative;
            overflow: hidden;
            min-width: 180px;
            cursor: pointer;
        }

        .btn-teal i {
            margin-right: 0.5rem;
        }

        .btn-teal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-teal:hover::before {
            left: 100%;
        }

        .btn-teal:hover {
            background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 150, 136, 0.4);
            color: white;
        }

        .btn-teal:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 150, 136, 0.3);
        }

        .btn-teal:focus {
            box-shadow: 0 0 0 0.2rem rgba(0, 150, 136, 0.25),
                        0 4px 12px rgba(0, 150, 136, 0.3);
            color: white;
        }

        /* Loading state */
        .btn-teal.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-teal.loading::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            margin: auto;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Form validation styles */
        .form-control.is-valid {
            border-color: var(--teal);
        }

        .form-control.is-invalid {
            border-color: #dc3545;
        }

        /* Form animations */
        .form-group {
            opacity: 0;
            transform: translateY(20px);
            animation: slideInUp 0.6s ease forwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }

        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Alert styles */
        .alert-success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 1px solid #28a745;
            color: #155724;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 1.5rem;
        }

        .alert-danger {
            background: linear-gradient(135deg, #f8d7da 0%, #f1b0b7 100%);
            border: 1px solid #dc3545;
            color: #721c24;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 1.5rem;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 1rem 0;
            }

            .main-container {
                padding: 0 0.5rem;
            }

            .form-container {
                padding: 1.5rem;
                margin: 0.5rem 0;
            }
            
            .btn-teal {
                width: 100%;
                padding: 16px;
            }

            .form-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 1rem;
            }

            .form-label {
                font-size: 0.9rem;
            }

            .form-control {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    
    <div class="main-container">
        <!-- Header -->
        <div class="form-header">
            <h1 class="form-title">
                <i class="fas fa-edit"></i>
                Update Department
            </h1>
            <p class="form-subtitle">Modify department information below</p>
        </div>

        <!-- Form Container -->
        <div class="form-container">
            <form method="POST" id="departmentForm">
                <div class="form-group">
                    <label for="department_name" class="form-label">
                        <i class="fas fa-building"></i>
                        Department Name
                    </label>
                    <input type="text" 
                           class="form-control" 
                           id="department_name" 
                           name="department_name" 
                           value="{{ department.department_name }}" 
                           required 
                           maxlength="100"
                           placeholder="Enter department name">
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">
                        <i class="fas fa-align-left"></i>
                        Description
                    </label>
                    <div class="textarea-container">
                        <textarea class="form-control" 
                                  id="description" 
                                  name="description" 
                                  maxlength="500" 
                                  placeholder="Enter department description (optional)">{{ department.description }}</textarea>
                        <div class="char-counter" id="charCounter">0/500</div>
                    </div>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn btn-teal" id="submitBtn">
                        <i class="fas fa-save"></i>
                        Update Department
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Character counter for textarea
        const textarea = document.getElementById('description');
        const charCounter = document.getElementById('charCounter');

        function updateCharCounter() {
            const currentLength = textarea.value.length;
            const maxLength = textarea.getAttribute('maxlength');
            charCounter.textContent = `${currentLength}/${maxLength}`;
            
            // Change color based on usage
            if (currentLength > maxLength * 0.9) {
                charCounter.style.color = '#f44336';
            } else if (currentLength > maxLength * 0.8) {
                charCounter.style.color = '#ff9800';
            } else {
                charCounter.style.color = 'var(--teal)';
            }
        }

        textarea.addEventListener('input', updateCharCounter);
        textarea.addEventListener('focus', () => {
            charCounter.style.opacity = '1';
        });
        textarea.addEventListener('blur', () => {
            charCounter.style.opacity = '0.7';
        });

        // Initialize character counter
        updateCharCounter();

        // Form submission with loading state
        document.getElementById('departmentForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = 'Updating...';
        });

        // Form validation
        const departmentNameInput = document.getElementById('department_name');

        departmentNameInput.addEventListener('input', function() {
            if (this.value.trim().length >= 2) {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
            } else {
                this.classList.remove('is-valid');
                this.classList.add('is-invalid');
            }
        });

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.max(120, textarea.scrollHeight) + 'px';
        }

        textarea.addEventListener('input', function() {
            autoResize(this);
        });

        // Initialize textarea height
        autoResize(textarea);

        // Prevent form submission if validation fails
        document.getElementById('departmentForm').addEventListener('submit', function(e) {
            const departmentName = document.getElementById('department_name').value.trim();
            
            if (departmentName.length < 2) {
                e.preventDefault();
                document.getElementById('department_name').classList.add('is-invalid');
                document.getElementById('department_name').focus();
                
                // Show error message
                showAlert('Department name must be at least 2 characters long.', 'danger');
            }
        });

        // Alert function
        function showAlert(message, type) {
            const existingAlert = document.querySelector('.alert');
                       if (existingAlert) {
                existingAlert.remove();
            }

            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} me-2"></i>
                ${message}
            `;
            
            document.querySelector('.form-container').insertBefore(alertDiv, document.querySelector('form'));
            
            // Auto-remove alert after 5 seconds
            setTimeout(() => {
                if (alertDiv && alertDiv.parentNode) {
                    alertDiv.style.opacity = '0';
                    alertDiv.style.transform = 'translateY(-20px)';
                    setTimeout(() => alertDiv.remove(), 300);
                }
            }, 5000);
        }

        // Add enter key support for form submission
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                document.getElementById('departmentForm').submit();
            }
        });

        // Add smooth transitions for form elements
        document.addEventListener('DOMContentLoaded', function() {
            // Animate form container on load
            const formContainer = document.querySelector('.form-container');
            formContainer.style.opacity = '0';
            formContainer.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                formContainer.style.transition = 'all 0.6s ease';
                formContainer.style.opacity = '1';
                formContainer.style.transform = 'translateY(0)';
            }, 100);

            // Focus first input
            setTimeout(() => {
                document.getElementById('department_name').focus();
            }, 800);
        });

        // Add input formatting
        departmentNameInput.addEventListener('input', function() {
            // Capitalize first letter of each word
            let words = this.value.split(' ');
            words = words.map(word => {
                if (word.length > 0) {
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                }
                return word;
            });
            this.value = words.join(' ');
        });

        // Add paste handling for textarea
        textarea.addEventListener('paste', function(e) {
            setTimeout(() => {
                updateCharCounter();
                autoResize(this);
            }, 10);
        });

        // Add keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + S to save
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                document.getElementById('departmentForm').submit();
            }
            
            // Escape to clear current field
            if (e.key === 'Escape') {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    document.activeElement.blur();
                }
            }
        });

        // Add form dirty checking
        let formChanged = false;
        const originalValues = {
            department_name: document.getElementById('department_name').value,
            description: document.getElementById('description').value
        };

        function checkFormChanges() {
            const currentValues = {
                department_name: document.getElementById('department_name').value,
                description: document.getElementById('description').value
            };

            formChanged = JSON.stringify(originalValues) !== JSON.stringify(currentValues);
            
            const submitBtn = document.getElementById('submitBtn');
            if (formChanged) {
                submitBtn.style.background = 'linear-gradient(135deg, #ff6b35 0%, #f7931e 100%)';
                submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
            } else {
                submitBtn.style.background = 'linear-gradient(135deg, var(--teal) 0%, var(--teal-card) 100%)';
                submitBtn.innerHTML = '<i class="fas fa-save"></i> Update Department';
            }
        }

        document.getElementById('department_name').addEventListener('input', checkFormChanges);
        document.getElementById('description').addEventListener('input', checkFormChanges);

        // Warn before leaving with unsaved changes
        window.addEventListener('beforeunload', function(e) {
            if (formChanged) {
                e.preventDefault();
                e.returnValue = 'You have unsaved changes. Are you sure you want to leave?';
            }
        });

        // Reset form changed flag on successful submission
        document.getElementById('departmentForm').addEventListener('submit', function() {
            formChanged = false;
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
