<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --accent-teal: #38b2ac;
            --border-teal: #b2f5ea;
            --input-bg: #f9fafb;
            --card-bg: #fff;
            --shadow-teal: rgba(56,178,172,0.08);
            --text-main: #000;
        }

        body {
            background: var(--card-bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 6px 24px var(--shadow-teal);
            border: 1px solid var(--border-teal);
            position: relative;
            padding: 1.3rem 1.1rem;
            width: 100%;
            max-width: 340px;
            margin: auto;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--accent-teal);
        }

        h2 {
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 1.1rem;
            text-align: center;
        }

        label {
            color: var(--text-main);
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-control {
            border: 1.5px solid #ddd;
            border-radius: 10px;
            padding: 0.6rem 0.85rem;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 0.13rem rgba(56,178,172,0.12);
            background: #fff;
            color: var(--text-main);
        }

        .form-control:valid {
            border-color: var(--accent-teal);
            background: #fff;
        }

        /* Checkbox */
        .form-check {
            margin: 1.1rem 0 0.8rem 0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .form-check-input {
            width: 1.1rem;
            height: 1.1rem;
            border: 1.2px solid #ddd;
            border-radius: 4px;
            background: var(--input-bg);
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }

        .form-check-input:checked {
            background: var(--accent-teal);
            border-color: var(--accent-teal);
        }

        .form-check-label {
            color: #555;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 0;
        }

        /* Button Styling */
        .btn-primary {
            background: var(--accent-teal);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.62rem 1.2rem;
            border-radius: 10px;
            font-size: 1rem;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 0.7rem;
        }

        .btn-primary:hover, .btn-primary:focus {
            background: #269d96;
            color: #fff;
            outline: none;
        }

        .alert {
            border-radius: 8px;
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .alert-success, .alert-info {
            background: rgba(56,178,172,0.10);
            color: var(--accent-teal);
            border-left: 4px solid var(--accent-teal);
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.10);
            color: #a51825;
            border-left: 4px solid #dc3545;
        }

        .invalid-feedback {
            color: #dc3545;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .valid-feedback {
            color: var(--accent-teal);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .forgot-link {
            color: var(--accent-teal);
            text-decoration: none;
            font-size: 0.97rem;
            transition: color 0.2s;
            display: block;
            text-align: right;
            margin-top: -0.5rem;
        }
        .forgot-link:hover, .forgot-link:focus {
            color: #269d96;
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 0.9rem 0.2rem;
                border-radius: 9px;
                max-width: 96vw;
            }
            h2 { font-size: 1.05rem; margin-bottom: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2>Admin Login</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" class="form-control"
                        value="{{ form.username if form and form.username else '' }}" required>
                    <div class="invalid-feedback">Please enter your username.</div>
                </div>

                <div class="mb-3">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>

                <div class="form-check">
                    <input type="checkbox" name="remember" id="remember" class="form-check-input">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
                <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Bootstrap validation
      document.addEventListener('DOMContentLoaded', function () {
        (() => {
          'use strict';
          var forms = document.querySelectorAll('.needs-validation');
          Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
              if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
              }
              form.classList.add('was-validated');
            }, false);
          });
        })();
      });
    </script>
</body>
</html>
