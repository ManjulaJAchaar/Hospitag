<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Bed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .text-teal { color: #008080 !important; }
        .btn-teal { background:#008080; color:#fff; border: none;}
        .btn-teal:hover { background:#006666; }
        .card-header { background: #008080; color:#fff; }
        .card, .form-control, .form-select { border-radius: 0.45rem; }
    </style>
</head>
<body>
<div class="container py-4">
    <h2 class="text-teal mb-4">Edit Bed</h2>
    <div class="card shadow-sm border-teal">
        <div class="card-header">Edit Bed</div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Department</label>
                        <select name="department_id" class="form-select" required>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}" {% if dept.id == bed.department_id %}selected{% endif %}>{{ dept.department_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Floor</label>
                        <input type="number" name="floor_number" min="1" class="form-control" required value="{{ bed.floor_number }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Room</label>
                        <input type="text" name="room_number" class="form-control" required value="{{ bed.room_number }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Bed No</label>
                        <input type="text" name="bed_number" class="form-control" required value="{{ bed.bed_number }}">
                    </div>
                    <div class="col-md-3 d-grid">
                        <label style="visibility:hidden" class="form-label">.</label>
                        <button type="submit" class="btn btn-teal">Update Bed</button>
                        <a href="{{ url_for('bed_management') }}" class="btn btn-secondary mt-2">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
