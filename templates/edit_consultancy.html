<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Consultancy - {{ record.patient_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {background:#f7fafa;font-family:'Segoe UI',Arial,sans-serif;}
    .header{background:#009688;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;}
    .header h3{margin:0;font-weight:600;}
    .form-label{font-weight:600;color:#008080;}
    .patient-info{background:#e8f5e8;border-left:4px solid #28a745;padding:15px;margin-bottom:20px;}
  </style>
</head>

<body>
  <div class="header">
    <h3><i class="bi bi-pencil-square"></i> Edit Consultancy Record #{{ record.id }}</h3>
    <div>
      <a href="{{ url_for('view_consultancy_details', id=record.id) }}" class="btn btn-light me-2">
        <i class="bi bi-eye"></i> View Details
      </a>
      <a href="{{ url_for('consultancy_records') }}" class="btn btn-outline-light">
        <i class="bi bi-arrow-left"></i> Back to Records
      </a>
    </div>
  </div>

  <div class="container mt-4">
    <!-- Patient Info Display -->
    <div class="patient-info">
      <h6 class="mb-2"><i class="bi bi-person-circle"></i> Patient Information</h6>
      <strong>{{ record.patient_name }}</strong> (ID: {{ record.patient_id }}) | 
      Created: {{ record.created_at.strftime('%d/%m/%Y %I:%M %p') if record.created_at else 'Unknown' }}
    </div>

    <div class="card">
      <div class="card-body">
        <form id="editForm" class="row g-3">
          <div class="col-md-6">
            <label class="form-label"><i class="bi bi-chat-text"></i> Chief Complaint</label>
            <textarea id="chiefComplaint" class="form-control" rows="3" required>{{ record.chief_complaint or '' }}</textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label"><i class="bi bi-clipboard-pulse"></i> Diagnosis</label>
            <textarea id="diagnosis" class="form-control" rows="3" required>{{ record.diagnosis or '' }}</textarea>
          </div>
          <div class="col-12">
            <label class="form-label"><i class="bi bi-prescription2"></i> Prescription</label>
            <textarea id="prescription" class="form-control" rows="4" required>{{ record.prescription or '' }}</textarea>
          </div>
          <div class="col-12">
            <label class="form-label"><i class="bi bi-journal-text"></i> Additional Notes</label>
            <textarea id="additionalNotes" class="form-control" rows="3">{{ record.additional_notes or '' }}</textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label"><i class="bi bi-calendar-event"></i> Appointment Date & Time</label>
            <input type="datetime-local" id="appointmentDateTime" class="form-control" required
                   value="{{ record.appointment_datetime.strftime('%Y-%m-%dT%H:%M') if record.appointment_datetime else '' }}">
          </div>
          <div class="col-12 text-center mt-4">
            <button type="button" class="btn btn-success btn-lg me-2" onclick="updateRecord()">
              <i class="bi bi-check-lg"></i> Update Record
            </button>
            <a href="{{ url_for('consultancy_records') }}" class="btn btn-secondary btn-lg">
              <i class="bi bi-x-lg"></i> Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function updateRecord() {
      const formData = {
        chief_complaint: document.getElementById('chiefComplaint').value.trim(),
        diagnosis: document.getElementById('diagnosis').value.trim(),
        prescription: document.getElementById('prescription').value.trim(),
        additional_notes: document.getElementById('additionalNotes').value.trim(),
        appointment_datetime: document.getElementById('appointmentDateTime').value
      };

      // Validation
      if (!formData.chief_complaint || !formData.diagnosis || !formData.prescription || !formData.appointment_datetime) {
        alert('Please fill in all required fields (Chief Complaint, Diagnosis, Prescription, and Appointment Date/Time).');
        return;
      }

      fetch(`/edit-consultancy/{{ record.id }}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(formData)
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert('Consultancy record updated successfully!');
          window.location.href = "{{ url_for('consultancy_records') }}";
        } else {
          alert('Error: ' + (data.error || 'Update failed'));
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('Network error occurred. Please try again.');
      });
    }
  </script>
</body>
</html>
