<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Add Product</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:900px">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="fw-bold mb-3">Add Product</h4>

      <form method="POST" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Product Name *</label>
          <input class="form-control" name="product_name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Brand Name</label>
          <input class="form-control" name="brand_name">
        </div>

        <div class="col-md-6">
          <label class="form-label">Generic Name</label>
          <input class="form-control" name="generic_name">
        </div>

        <div class="col-md-3">
          <label class="form-label">Unit</label>
          <input class="form-control" name="unit" placeholder="strip / bottle">
        </div>
        <div class="col-md-3">
          <label class="form-label">Pack Size</label>
          <input class="form-control" name="pack_size" placeholder="10 / 60ml">
        </div>

        <div class="col-md-6">
          <label class="form-label">HSN / Tax</label>
          <select class="form-select" name="hsn_id">
            <option value="">-- None --</option>
            {% for h in hsn_list %}
              <option value="{{ h.id }}">{{ h.hsn_code }} ({{ h.tax_percent }}%)</option>
            {% endfor %}
          </select>
          <div class="form-text">Add HSN first if list is empty.</div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Reorder Level</label>
          <input class="form-control" name="reorder_level" type="number" value="0">
        </div>

        <div class="col-12">
          <button class="btn btn-primary">Save Product</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('pharmacy_products') }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
