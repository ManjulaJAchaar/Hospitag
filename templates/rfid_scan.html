<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RFID Scan Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">RFID Scan Result: {{ rfid }}</h4>
                </div>
                <div class="card-body">
                    <div id="loading" class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Scanning...</span>
                        </div>
                        <p class="mt-2">Scanning RFID tag...</p>
                    </div>
                    
                    <div id="patient-data" style="display: none;">
                        <!-- Patient data will be loaded here -->
                    </div>
                    
                    <div id="error-message" style="display: none;" class="alert alert-danger">
                        <!-- Error message will be shown here -->
                    </div>
                </div>
                <div class="card-footer">
                    <a href="{{ url_for('admin_patient_tracking') }}" class="btn btn-secondary">Back to Monitoring</a>
                    <button onclick="location.reload()" class="btn btn-primary">Scan Again</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Auto-scan when page loads
window.onload = function() {
    scanRFID('{{ rfid }}');
};

function scanRFID(rfid) {
    fetch(`/admin/api/scan-rfid/${rfid}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            
            if (data.success) {
                displayPatientData(data.patient);
            } else {
                displayError(data.message || 'Patient not found');
            }
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            displayError('Error occurred while scanning');
        });
}

function displayPatientData(patient) {
    const patientDataDiv = document.getElementById('patient-data');
    
    patientDataDiv.innerHTML = `
        <div class="row">
            <div class="col-md-6">
                <h5 class="text-primary">Patient Information</h5>
                <table class="table table-borderless">
                    <tr><td><strong>Name:</strong></td><td>${patient.full_name}</td></tr>
                    <tr><td><strong>Age:</strong></td><td>${patient.age} years</td></tr>
                    <tr><td><strong>Gender:</strong></td><td>${patient.gender}</td></tr>
                    <tr><td><strong>Phone:</strong></td><td>${patient.phone}</td></tr>
                    <tr><td><strong>Email:</strong></td><td>${patient.email || 'Not provided'}</td></tr>
                </table>
            </div>
            <div class="col-md-6">
                <h5 class="text-primary">Registration Details</h5>
                <table class="table table-borderless">
                    <tr><td><strong>RFID:</strong></td><td><span class="badge bg-info">${patient.rfid_uid}</span></td></tr>
                    <tr><td><strong>Added By:</strong></td><td>${patient.added_by_staff} (${patient.staff_role})</td></tr>
                    <tr><td><strong>Admin:</strong></td><td>${patient.admin_name}</td></tr>
                    <tr><td><strong>Registered:</strong></td><td>${new Date(patient.created_at).toLocaleString()}</td></tr>
                </table>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-12">
                <h5 class="text-primary">Address</h5>
                <p class="bg-light p-3 rounded">${patient.address}</p>
            </div>
        </div>
    `;
    
    patientDataDiv.style.display = 'block';
}

function displayError(message) {
    const errorDiv = document.getElementById('error-message');
    errorDiv.innerHTML = `<strong>Error:</strong> ${message}`;
    errorDiv.style.display = 'block';
}
</script>

</body>
</html>
