<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Representative Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --accent-teal: #38b2ac;
      --border-teal: #b2f5ea;
      --input-bg: #f9fafb;
      --card-bg: #fff;
      --shadow-teal: rgba(56,178,172,0.08);
      --text-main: #000;
      --text-muted: #555;
    }
    body {
      background: var(--card-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 6px 24px var(--shadow-teal);
      border: 1px solid var(--border-teal);
      position: relative;
      padding: 1.3rem 1.1rem;
      max-width: 340px;
      width: 100%;
      margin: auto;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: var(--accent-teal);
    }
    h3 {
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 1.1rem;
      text-align: center;
    }
    .form-label {
      color: var(--text-main);
      font-weight: 500;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .form-control {
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 0.6rem 0.85rem;
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent-teal);
      box-shadow: 0 0 0 0.13rem rgba(56,178,172,0.12);
      background: #fff;
      color: var(--text-main);
    }
    .form-control:valid {
      border-color: var(--accent-teal);
      background: #fff;
    }
    .input-group .form-control {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }
    .input-group .btn {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      background: var(--input-bg);
      color: var(--accent-teal);
      border: 1.5px solid #ddd;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
    }
    .input-group .btn:hover, .input-group .btn:focus {
      background: var(--accent-teal);
      color: #fff;
      border-color: var(--accent-teal);
    }
    .btn-teal {
      background: var(--accent-teal);
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 0.62rem 1.2rem;
      border-radius: 10px;
      font-size: 1rem;
      transition: background 0.2s;
      width: 100%;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-teal:hover, .btn-teal:focus {
      background: #269d96;
      color: #fff;
    }
    .alert {
      border-radius: 8px;
      font-weight: 500;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .alert-success, .alert-info {
      background: rgba(56,178,172,0.1);
      color: var(--accent-teal);
      border-left: 4px solid var(--accent-teal);
    }
    .alert-danger {
      background: rgba(220,53,69,0.10);
      color: #a51825;
      border-left: 4px solid #dc3545;
    }
    .invalid-feedback {
      color: #dc3545;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .valid-feedback {
      color: var(--accent-teal);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .extra-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.55rem;
      margin-top: 0.12rem;
    }
    .form-check-label {
      color: var(--text-muted);
      font-size: 0.96rem;
      margin-bottom: 0;
      font-weight: 400;
      user-select: none;
    }
    .forgot-link {
      color: var(--accent-teal);
      text-decoration: none;
      font-size: 0.97rem;
      transition: color 0.2s;
      text-align: right;
      margin-left: 0.5rem;
    }
    .forgot-link:hover, .forgot-link:focus {
      color: #269d96;
      text-decoration: underline;
    }
    @media (max-width: 576px) {
      body { padding: 0.5rem;}
      .login-card {
        padding: 0.9rem 0.2rem;
        border-radius: 9px;
        max-width: 96vw;
      }
      h3 { font-size: 1.05rem; margin-bottom: 0.7rem; }
    }
  </style>
</head>

<body>
  <div class="login-card">
    <h3>Representative Login</h3>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="needs-validation" novalidate>
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-control" name="username" id="username" value="{{ form.username or '' }}" required>
        <div class="invalid-feedback">Please enter your username.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="repPassword">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="repPassword" name="password" required>
          <button class="btn btn-outline-secondary" type="button" id="toggleRepPassword" aria-label="Show password">
            <i class="bi bi-eye" id="repPasswordIcon"></i>
          </button>
          <div class="invalid-feedback">Please enter your password.</div>
        </div>
      </div>

      <div class="extra-row">
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
          <label class="form-check-label" for="remember_me">Remember Me</label>
        </div>
        <a href="{{ url_for('rep_forgot_password') }}" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-teal">
        <i class="bi bi-box-arrow-in-right"></i>Login
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Password toggle
    document.addEventListener('DOMContentLoaded', function () {
      var toggle = document.getElementById('toggleRepPassword');
      var pwd = document.getElementById('repPassword');
      var icon = document.getElementById('repPasswordIcon');
      if (toggle && pwd && icon) {
        toggle.addEventListener('click', function () {
          if (pwd.type === "password") {
            pwd.type = "text";
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
          } else {
            pwd.type = "password";
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
          }
        });
        toggle.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            toggle.click();
          }
        });
      }
      // Bootstrap validation
      (() => {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function (form) {
          form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
              event.preventDefault();
              event.stopPropagation();
            }
            form.classList.add('was-validated');
          }, false);
        });
      })();
    });
  </script>
</body>
</html>
