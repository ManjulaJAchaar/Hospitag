<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Bill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Billing / Sales</h4>
    <a class="btn btn-outline-secondary" href="{{ url_for('pharmacy_dashboard') }}">Back</a>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} mb-2">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" id="billForm" class="card p-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Patient (optional)</label>
        <select class="form-select" name="patient_id">
          <option value="">Walk-in / No patient</option>
          {% for p in patients %}
            <option value="{{ p.id }}">{{ p.full_name }} ({{ p.phone }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Bill No (optional)</label>
        <input class="form-control" name="bill_no" placeholder="Auto / Manual">
      </div>
    </div>

    <hr class="my-3"/>

    <div class="table-responsive">
      <table class="table align-middle" id="itemsTable">
        <thead>
          <tr>
            <th style="min-width:220px;">Product</th>
            <th style="min-width:220px;">Batch</th>
            <th style="width:120px;">Qty</th>
            <th style="width:160px;">Price</th>
            <th style="width:140px;">Tax %</th>
            <th style="width:140px;">Line Total</th>
            <th style="width:70px;"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-primary" onclick="addRow()">+ Add Item</button>
      <button type="submit" class="btn btn-success">Save Bill</button>
    </div>

    <div class="mt-3 text-end">
      <div><strong>Subtotal:</strong> ₹ <span id="subtotal">0.00</span></div>
      <div><strong>Tax:</strong> ₹ <span id="tax">0.00</span></div>
      <div class="fs-5"><strong>Grand Total:</strong> ₹ <span id="grand">0.00</span></div>
    </div>
  </form>

</div>

<script>
  const PRODUCTS = {{ products|tojson }};
  function money(n){ return (isFinite(n) ? n : 0).toFixed(2); }

  function buildProductSelect() {
    let html = `<select class="form-select product" name="product_id[]" required>
      <option value="">Select</option>`;
    for (const p of PRODUCTS) html += `<option value="${p.id}">${p.product_name}</option>`;
    html += `</select>`;
    return html;
  }

  async function loadBatches(productId, batchSelect){
    batchSelect.innerHTML = `<option value="">Loading...</option>`;
    if(!productId){ batchSelect.innerHTML = `<option value="">Select product first</option>`; return; }

    const r = await fetch(`/pharmacy/api/product/${productId}/batches`);
    const data = await r.json();
    if(!data.ok){ batchSelect.innerHTML = `<option value="">No batches</option>`; return; }

    let html = `<option value="">Select batch</option>`;
    for(const b of data.batches){
      const exp = b.expiry_date ? b.expiry_date : "N/A";
      html += `<option value="${b.id}" data-price="${b.selling_price || 0}">
        ${b.batch_no} | Exp: ${exp} | Qty: ${b.qty_on_hand}
      </option>`;
    }
    batchSelect.innerHTML = html;
  }

  function recalc(){
    let subtotal = 0, tax = 0;
    document.querySelectorAll("#itemsTable tbody tr").forEach(tr=>{
      const qty = parseFloat(tr.querySelector(".qty").value || 0);
      const price = parseFloat(tr.querySelector(".price").value || 0);
      const t = parseFloat(tr.querySelector(".taxp").value || 0);
      const base = qty * price;
      const taxAmt = base * (t/100);
      const total = base + taxAmt;
      tr.querySelector(".linetotal").textContent = money(total);
      subtotal += base;
      tax += taxAmt;
    });
    document.getElementById("subtotal").textContent = money(subtotal);
    document.getElementById("tax").textContent = money(tax);
    document.getElementById("grand").textContent = money(subtotal + tax);
  }

  function addRow(){
    const tbody = document.querySelector("#itemsTable tbody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${buildProductSelect()}</td>
      <td>
        <select class="form-select batch" name="batch_id[]" required>
          <option value="">Select product first</option>
        </select>
      </td>
      <td><input class="form-control qty" name="qty[]" type="number" min="1" value="1" required></td>
      <td><input class="form-control price" name="selling_price[]" type="number" step="0.01" min="0" value="0" required></td>
      <td><input class="form-control taxp" name="tax_percent[]" type="number" step="0.01" min="0" value="0"></td>
      <td class="linetotal">0.00</td>
      <td><button type="button" class="btn btn-sm btn-danger">X</button></td>
    `;
    tbody.appendChild(tr);

    const productSelect = tr.querySelector(".product");
    const batchSelect = tr.querySelector(".batch");
    const priceInput = tr.querySelector(".price");

    productSelect.addEventListener("change", async ()=>{
      await loadBatches(productSelect.value, batchSelect);
      priceInput.value = 0;
      recalc();
    });

    batchSelect.addEventListener("change", ()=>{
      const opt = batchSelect.options[batchSelect.selectedIndex];
      const p = opt ? parseFloat(opt.getAttribute("data-price") || "0") : 0;
      if(p > 0) priceInput.value = p;
      recalc();
    });

    tr.querySelector(".qty").addEventListener("input", recalc);
    tr.querySelector(".price").addEventListener("input", recalc);
    tr.querySelector(".taxp").addEventListener("input", recalc);

    tr.querySelector(".btn-danger").addEventListener("click", ()=>{
      tr.remove();
      recalc();
    });

    recalc();
  }

  // start with 1 row
  addRow();
</script>
</body>
</html>
