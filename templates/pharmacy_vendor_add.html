<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Vendor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: Inter, sans-serif; background: #f7fbfb; }
    .cardx { border:0; border-radius:16px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    .btn-teal { background:#14b8a6; border-color:#14b8a6; color:white; }
    .btn-teal:hover { background:#0d9488; border-color:#0d9488; color:white; }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="mb-0 fw-bold">Add Vendor</h3>
      <div class="text-muted">Enter vendor details (GSTIN / DL optional).</div>
    </div>
    <a href="{{ url_for('pharmacy_vendors') }}" class="btn btn-outline-secondary rounded-pill">
      <i class="fa-solid fa-arrow-left me-1"></i>Back
    </a>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card cardx">
    <div class="card-body p-4">
      <form method="POST">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Vendor Name <span class="text-danger">*</span></label>
            <input name="vendor_name" class="form-control" placeholder="Eg: ABC Medical Distributors" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Phone</label>
            <input name="phone" class="form-control" placeholder="Eg: 9876543210">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input name="email" type="email" class="form-control" placeholder="Eg: abc@gmail.com">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">GSTIN</label>
            <input name="gstin" class="form-control" placeholder="Eg: 29ABCDE1234F1Z5">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Drug License No</label>
            <input name="dl_no" class="form-control" placeholder="Eg: DL-XXXX-XXXX">
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Address</label>
            <textarea name="address" class="form-control" rows="3" placeholder="Vendor full address..."></textarea>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a href="{{ url_for('pharmacy_vendors') }}" class="btn btn-outline-secondary rounded-pill">Cancel</a>
          <button class="btn btn-teal rounded-pill" type="submit">
            <i class="fa-solid fa-check me-2"></i>Save Vendor
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
