<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Edit Department Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --teal: #20b2aa;
            --teal-dark: #1a9b96;
            --teal-soft: #eaf8f7;
            --bg: #f6f8fb;
            --border: #e6edf2;
            --text: #1f2937;
            --muted: #6b7280;
            --shadow: 0 10px 24px rgba(31, 41, 55, 0.08);
            --radius: 14px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
        }

        .dashboard-card {
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            background: #fff;
        }

        .card-header {
            background: var(--teal);
            color: #fff;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .btn-teal {
            background: var(--teal);
            border: 1px solid var(--teal);
            color: #fff;
        }

        .btn-teal:hover {
            background: var(--teal-dark);
            border-color: var(--teal-dark);
        }

        .btn-outline-teal {
            border: 1px solid var(--teal);
            color: var(--teal);
        }

        .btn-outline-teal:hover {
            background: var(--teal-soft);
            color: var(--teal-dark);
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 0.15rem rgba(32,178,170,.25);
        }

        label {
            font-weight: 600;
            color: var(--muted);
        }
    </style>
</head>

<body>

<div class="container py-4">

    <div class="card dashboard-card">

        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                <i class="fas fa-user-edit"></i> Edit Department Admin
            </h5>

            <a class="btn btn-sm btn-outline-light" href="/hr-view-department-admins">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Name</label>
                        <input class="form-control" name="admin_name" value="{{ admin.admin_name }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select class="form-select" name="admin_gender" required>
                            <option value="Male"   {{ 'selected' if admin.admin_gender=='Male' else '' }}>Male</option>
                            <option value="Female" {{ 'selected' if admin.admin_gender=='Female' else '' }}>Female</option>
                            <option value="Other"  {{ 'selected' if admin.admin_gender=='Other' else '' }}>Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control" name="admin_email" value="{{ admin.admin_email }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input class="form-control" name="admin_phone" value="{{ admin.admin_phone }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input class="form-control" name="admin_username" value="{{ admin.admin_username }}" required>
                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">
                    <button class="btn btn-teal">
                        <i class="fas fa-save"></i> Save Changes
                    </button>

                    <a class="btn btn-outline-teal" href="/hr-view-department-admins">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
